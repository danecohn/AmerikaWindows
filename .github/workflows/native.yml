name: Native Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python build.py
      - name: Launch packaged native app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          $appProcess = Start-Process -FilePath 'dist/AltStackSocial/AltStackSocial.exe' -ArgumentList @('--smoke-test', 'validation/native-smoke.png') -WindowStyle Hidden -PassThru -Wait
          if ($appProcess.ExitCode -ne 0) { throw 'Native startup failed' }
          if (-not (Test-Path 'validation/native-smoke.png')) { throw 'Native preview missing' }
      - uses: actions/upload-artifact@v7
        with:
          name: AltStackSocial-Windows
          path: |
            release/*
            validation/*.png
          if-no-files-found: error
          retention-days: 14
