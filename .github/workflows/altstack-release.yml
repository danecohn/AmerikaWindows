name: Publish Vigil Social for six platforms
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/altstack-release.yml
    - amerika/**
    - assets/**
    - packaging/**
    - scripts/**
    - start/**
    - build.py
    - requirements*.txt
    - upstream.json
    - release-notes.md
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: altstack-social-release
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: windows-x64
          runner: windows-2025
          python_arch: x64
        - target: windows-arm64
          runner: windows-11-arm
          python_arch: arm64
        - target: macos-x64
          runner: macos-15-intel
          python_arch: x64
        - target: macos-arm64
          runner: macos-15
          python_arch: arm64
        - target: linux-x64
          runner: ubuntu-24.04
          python_arch: x64
        - target: linux-arm64
          runner: ubuntu-24.04-arm
          python_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: ${{ matrix.python_arch }}
    - name: Install Linux runtime libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
        libdbus-1-3 libasound2t64 libgtk-3-0 libsecret-1-0 libpulse0 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 libxcb-render-util0
    - run: python -m pip install -r requirements-build.txt
    - name: Verify native account flows and icon painting
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest -vv tests/test_native.py tests/test_vigiltech.py
    - name: Verify isolated network and browser sign-in flows
      env:
        QT_QPA_PLATFORM: offscreen
      run: python -m pytest -vv tests/test_network.py
    - run: python build.py
    - name: Build additional installer formats
      if: runner.os != 'macOS'
      run: python scripts/package-extras.py
    - name: Verify installed Windows package
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        $installer=Get-ChildItem release -Filter '*-setup.exe' | Select-Object -First 1
        $p=Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw 'Installer failed' }
        New-Item -ItemType Directory -Force validation | Out-Null
        $app=Join-Path $env:LOCALAPPDATA 'Programs/AltStackSocial/AltStackSocial.exe'
        $p=Start-Process $app -ArgumentList @('--smoke-test','validation/installed-windows.png') -Wait -PassThru
        if ($p.ExitCode -ne 0 -or -not (Test-Path 'validation/installed-windows.png')) { throw 'Installed app failed' }
        $installRoot=Join-Path $env:LOCALAPPDATA 'Programs/AltStackSocial'
        $sentinel=Join-Path $installRoot 'user-created-preserve.txt'
        Set-Content $sentinel 'Must survive removing program files'
        $p=Start-Process (Join-Path $installRoot 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
        if ($p.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw 'Uninstall did not preserve user-created files' }
    - name: Verify AppImage and Debian payload
      if: runner.os == 'Linux'
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        mkdir -p validation build/deb-proof
        APPIMAGE_EXTRACT_AND_RUN=1 release/*.AppImage --smoke-test validation/appimage.png
        dpkg-deb --info release/*.deb
        dpkg-deb --extract release/*.deb build/deb-proof
        build/deb-proof/opt/altstack-social/AltStackSocial --smoke-test validation/debian.png
        test -s validation/appimage.png
        test -s validation/debian.png
    - name: Launch packaged application
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen
      run: 'mkdir -p validation

        if [ "$RUNNER_OS" = "Windows" ]; then APP=dist/AltStackSocial/AltStackSocial.exe; elif [ "$RUNNER_OS" = "macOS" ];
        then APP=dist/AltStackSocial.app/Contents/MacOS/AltStackSocial; else APP=dist/AltStackSocial/AltStackSocial; fi

        "$APP" --smoke-test validation/native-smoke.png

        test -s validation/native-smoke.png'
    - name: Verify mounted Mac application
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        DMG=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
        hdiutil verify "$DMG"
        MOUNT=$(mktemp -d)
        hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
        trap 'hdiutil detach "$MOUNT"; rmdir "$MOUNT"' EXIT
        codesign --verify --deep --strict --verbose=2 "$MOUNT/AltStackSocial.app"
    - uses: actions/upload-artifact@v7
      with:
        name: Social-${{ matrix.target }}
        path: release/AltStackSocial-*
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: Social-preview-${{ matrix.target }}
        path: validation/*.png
        if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        pattern: Social-*
        path: release
        merge-multiple: true
    - name: Publish all six packages together
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: altstack-social-v1.3.2
      run: |
        set -euo pipefail
        test "$(find release -maxdepth 1 -type f -name 'AltStackSocial-*' ! -name '*.sha256' | wc -l)" -eq 12
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo 'Release already exists; bump the version instead of replacing published installers.' >&2
          exit 1
        fi
        gh release create "$TAG" --draft --target "$GITHUB_SHA" --title 'Vigil Social 1.3.2' --notes-file release-notes.md
        gh release upload "$TAG" release/AltStackSocial-*
        gh release edit "$TAG" --draft=false
